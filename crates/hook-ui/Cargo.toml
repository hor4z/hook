[package]
name = "hook-ui"
description = "Minimal immediate-mode UI engine for hook (trimmed from sherpa): core, text, wgpu painter and a text field"
version.workspace = true
edition.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
harfrust = "0.13.3"
kurbo = "0.11.3"
read-fonts = "0.43.3"
resvg = { version = "0.45.1", default-features = false }
tiny-skia = "0.11.4"
wgpu.workspace = true
